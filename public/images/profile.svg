<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0e7490" />
    </linearGradient>
    <linearGradient id="skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="100%" stop-color="#fbd38d" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="40" fill="url(#bgGrad)" />
  <circle cx="200" cy="200" r="150" fill="none" stroke="url(#accent)" stroke-width="3" stroke-dasharray="8 8" opacity="0.4" />
  <!-- Body/Shoulders -->
  <path d="M 110 360 C 110 270, 290 270, 290 360 Z" fill="#334155" />
  <path d="M 130 360 C 130 290, 270 290, 270 360 Z" fill="#1e293b" />
  <path d="M 160 360 L 200 300 L 240 360 Z" fill="#6366f1" opacity="0.9" />
  <!-- Head & Neck -->
  <rect x="180" y="225" width="40" height="50" rx="10" fill="url(#skin)" />
  <ellipse cx="200" cy="180" rx="60" ry="70" fill="url(#skin)" />
  <!-- Hair -->
  <path d="M 140 180 C 135 120, 265 110, 260 180 C 250 140, 150 140, 140 180 Z" fill="#1e293b" />
  <path d="M 145 155 C 175 115, 230 115, 255 140 C 240 130, 160 130, 145 155 Z" fill="#0f172a" />
  <!-- Glasses -->
  <rect x="155" y="170" width="36" height="24" rx="6" fill="none" stroke="#6366f1" stroke-width="3.5" />
  <rect x="209" y="170" width="36" height="24" rx="6" fill="none" stroke="#6366f1" stroke-width="3.5" />
  <line x1="191" y1="182" x2="209" y2="182" stroke="#6366f1" stroke-width="3" />
  <!-- Eyes -->
  <circle cx="173" cy="182" r="4" fill="#0f172a" />
  <circle cx="227" cy="182" r="4" fill="#0f172a" />
  <!-- Smile -->
  <path d="M 185 215 Q 200 228 215 215" fill="none" stroke="#b45309" stroke-width="3" stroke-linecap="round" />
  <!-- Floating Code Badges -->
  <g transform="translate(45, 120)">
    <rect width="80" height="32" rx="16" fill="#1e293b" stroke="#6366f1" stroke-width="1.5" />
    <text x="40" y="20" fill="#a5b4fc" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">&lt;code/&gt;</text>
  </g>
  <g transform="translate(280, 220)">
    <rect width="75" height="32" rx="16" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5" />
    <text x="37" y="20" fill="#67e8f9" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">{ full:stack }</text>
  </g>
</svg>
